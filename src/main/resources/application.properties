# ==========================================
# CẤU HÌNH CHỐNG RỚT KẾT NỐI CHO HOST SOMEE
# ==========================================
# Thời gian sống tối đa của 1 kết nối (30 giây) - Ép Java phải tạo kết nối mới liên tục
spring.datasource.hikari.max-lifetime=30000
# Thời gian chờ tối đa nếu kết nối rảnh rỗi (10 giây)
spring.datasource.hikari.idle-timeout=10000
# Thời gian tối đa để test xem kết nối còn sống không
spring.datasource.hikari.validation-timeout=3000
# Câu lệnh test kết nối (Gõ cửa xem Database có nhà không)
spring.datasource.hikari.connection-test-query=SELECT 1